<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#15171c"><title>Fatbike Tracker</title><link rel="stylesheet" href="style.css"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="app.js"></script></head><body><main><header><span>🚲</span><h1>Fatbike Tracker</h1><button id="logout" class="small" hidden>Uitloggen</button></header><section id="login"><article><h2>Welkom terug</h2><p>Log in om jouw fatbikes bij te houden.</p><form id="loginForm"><label>E-mailadres<input id="email" type="email" autocomplete="username" required></label><label>Wachtwoord<input id="password" type="password" autocomplete="current-password" required></label><button class="primary">Inloggen</button></form></article></section><section id="dashboard" hidden><article id="home"><p>Vandaag gespot</p><strong class="big" id="today">0</strong><button class="primary" id="add" disabled>＋ Fatbike toevoegen</button><button class="small" id="undo" disabled>− Laatste registratie verwijderen</button></article><div class="tiles"><article><p>Deze week</p><strong id="week">0</strong></article><article><p>All-time</p><strong id="total">0</strong></article></div><article id="stats"><h2>Afgelopen 7 dagen</h2><div id="chart" class="chart"></div><p id="record"></p></article><article id="history" hidden><h2>Recente registraties</h2><ul id="entries"></ul><button id="more" class="small" hidden>Meer tonen</button></article><nav><button data-tab="home">⌂ Home</button><button data-tab="stats">▥ Statistieken</button><button data-tab="history">◷ Historie</button></nav></section><p id="status" role="status" aria-live="polite"></p></main></body></html>
